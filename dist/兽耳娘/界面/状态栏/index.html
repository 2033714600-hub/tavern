降火种」的一丝希冀摸到河滩边缘时，看到的却是从变形的金属舱体里走出来的你。没有预想中凶神恶煞的异族掠夺者，也没有发狂的巨兽，只有一个没有兽耳和尾巴、穿着奇异服饰的年轻雄性。看着因为寒冷而嘴唇发白、却依然壮着胆子把妹妹护在身后的橘猫少女琥珀，再看看不远处那个明显刚经历过雨水冲刷、飘不出半点炊烟的破败营地，你很快明白了她们的窘境，主动收起了防备，晃了晃手中能生火的工具，向她们表达了善意。\n\n<npc_panel>\n[姓名|琥珀]\n[种族|猫耳娘(食肉系)]\n[档位|精通]\n[饱食度|45|勉强吃饱]\n[好感度|34|戒备里的感激]\n[技能|狩猎:58/战斗:62/采集:38/后勤:45]\n[行为|把妹妹挡在身后，橘色猫耳压平又立起，尾巴绷得很直]\n</npc_panel>\n\n确认你孤身一人且并无恶意后，对温暖的极度渴望最终战胜了戒备。在黑狼少女朔春沉默的护送与霜华担忧的注视下，你跟随着她们踏入了这片湖畔营地。\n\n<npc_panel>\n[姓名|朔春]\n[种族|黑狼娘(食肉系)]\n[档位|精通]\n[饱食度|42|勉强]\n[好感度|26|冷淡的观察]\n[技能|狩猎:72/战斗:68/采集:28/后勤:22]\n[行为|一手按着骨刀柄，走在队伍最外侧，黑尾几乎不动]\n</npc_panel>\n\n一进营地，湿冷的寒意便扑面而来。营地中央的火塘里积着发黑的冷灰，四周散落着几捆因为淋了雨而略显潮湿的木柴。几只留守的年幼兽耳娘正缩在漏风的窝棚角落里瑟瑟发抖，看到琥珀和霜华带回来一个陌生的无毛雄性，纷纷露出了好奇又怯生生的眼神。\n\n「火塘四天前就被大雨浇灭了……」盘着白色羊角的霜华走上前，有些局促地搓了搓冻得微红的手指，从窝棚最干燥的角落里抱出一小捧她视若珍宝、一直贴身藏着的干苔藓与枯树皮，轻声说道，「如果你真的懂『智者』大人的生火术……这些是营地里最后一点干引火物了，拜托你试试吧。」\n\n<npc_panel>\n[姓名|霜华]\n[种族|羊角娘(食草系)]\n[档位|大师]\n[饱食度|46|勉强吃饱]\n[好感度|48|亲近]\n[技能|狩猎:12/战斗:18/采集:52/后勤:82]\n[行为|捧着最后一点干苔藓与枯树皮，指节冻得发红，声音放得很轻]\n</npc_panel>\n\n在四双眼睛屏息凝神的注视下，你蹲在火塘边，将干苔藓和细枝搭成透气的结构，随后掏出随身携带的打火机，轻轻一按。「啪。」一簇纯净而稳定的橘红色火苗，毫无预兆地在你的指尖跳跃而出。没有繁琐的祭祀祷告，也没有长达数小时的钻木摩擦——火，就这么凭空诞生在了你的掌心。\n\n「哇——！」林果第一个没忍住惊呼出声，黄黑相间的尾巴一下子炸开了花，她瞪圆了琥珀色的眼睛，连害怕都忘了，往前凑了半步死死盯着你的手指：「亮了！琥珀姐姐你看，他的手指头会吐火！」\n\n旁边的琥珀猫耳猛地向后压平，原本叉着腰故作镇定的姿态瞬间绷不住了，瞳孔因为震惊而微微收缩。就连一直按着骨刀柄、站在外侧警戒的朔春，也在火苗亮起的瞬间屏住了呼吸，黑色的狼尾不自觉地轻轻晃动了一下。\n\n你将火苗凑近干苔藓。干燥的绒毛瞬间被点燃，紧接着引燃了细枝与架好的木柴。不过片刻工夫，橘红色的火焰便重新在火塘中欢快地升腾起来，噼啪作响的火星驱散了盘踞在营地多日的湿寒，将周围几张精致却略显瘦削的脸庞映照得一片温暖。\n\n久违的热浪扑面而来，营地里瞬间响起了一片满足的轻叹与细碎的呼噜声。林果欢呼一声，直接蹲到火塘边把冻僵的小手伸过去烤火，喉咙里发出咕噜咕噜的舒服声响。霜华眼底泛起一层温润的水光，长长地松了一口气，转身便忙不迭地抱来一只接水的木槽，把火堆边烧热的石头一块块夹进去，准备为大家烧一锅驱寒的热水。朔春紧绷的脊背彻底放松下来，默默走到营地入口处坐下，将后背留给了温暖的火光。\n\n而琥珀站在火塘旁，橘色的猫尾尖轻轻勾了勾。她看了一眼正在享受温暖的妹妹，又转头看向拍了拍手站起身的你，脸颊在火光的映照下微微泛红，紧绷的声音明显软了下来，带着几分笨拙的郑重：「……谢谢你。在大部落里，哪怕是拿十张完整的林鹿皮，智者也不会轻易替外人点一次火的。」\n\n她顿了顿，伸手指了指火塘最避风的内侧位置，那里已经被霜华铺好了一层干净柔软的干草与兽皮：「我们已经好几天没有火源了，你帮我们点燃了火塘，你就是我们湖畔营地的恩人。天快黑了，外面的林子危险……你今晚就留在火塘边休息吧。那个……霜华已经在烧水了，我去给你拿块风干肉过来！」\n'.trim(),t=(0,r.S7)();return n.default`
